name: Wipe Repository

# Manual trigger only. Deletes every tracked file in the repo, no
# confirmation prompt and no backup tag.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete all tracked files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf --quiet .
          git commit -m "chore: wipe repository contents" --allow-empty
          git push origin HEAD
