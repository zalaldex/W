name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # FIXED: Changed from v6 to v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Dependencies
        run: |
          go mod tidy
          if [ ! -z "$(git status --porcelain)" ]; then
            echo "Error: 'go mod tidy' modified the workspace. Please run 'go mod tidy' locally and commit the go.sum file."
            exit 1
          fi

      - name: Vet Code
        run: go vet ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -o bot-binary ./cmd/bot
        
